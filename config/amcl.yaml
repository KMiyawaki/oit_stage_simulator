amcl:
  ros__parameters:
    use_sim_time: true
    # https://github.com/ros-navigation/navigation2/blob/jazzy/nav2_amcl/src/motion_model/differential_motion_model.cpp#L86
    alpha1: 0.15  # rot->rot weight
    alpha2: 0.15  # trans->rot weight
    alpha3: 0.15  # trans->trans weight
    alpha4: 0.15  # rot->trans weight
    alpha5: 0.01 # for Omni
    base_frame_id: "base_link" #"base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 30.0 # 150.0 for long range lidar
    laser_min_range: 0.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 700
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.25 # 0.1
    tf_broadcast: true
    transform_tolerance: 5.0
    update_min_a: 0.04363323129985824 # python -c "import math; print(math.radians(2.5))"
    update_min_d: 0.05 
    z_hit: 0.80    # Mixture weight for the probability of a scan being 'hit' on the map.
    z_short: 0.00  # Weight for unexpected obstacles (e.g. people). Not used in likelihood_field.
    z_max: 0.00    # Weight for measurement failures (max range readings). Not used in likelihood_field.
    z_rand: 0.20   # Weight for random noise. Increasing this makes localization more robust to environment changes.
    scan_topic: scan
    set_initial_pose: True
    initial_pose: { x: 0.0, y: 0.0, z: 0.0, yaw: 0.0 }
